<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDHAS — Campus Portal</title>
    <link rel="stylesheet" href="incloud-design.css">
    <link rel="stylesheet" href="medhas-animation.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #0B0D11;
            font-family: var(--ich-font, "Plus Jakarta Sans", sans-serif);
            color: #EEF0F4;
            overflow-x: hidden;
            position: relative;
        }
    </style>
</head>
<body>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
    redirectIfAuthenticated();
</script>

<!-- Full-Screen Ambient Atmospheric Vignette -->
<div class="medhas-atmosphere-overlay" aria-hidden="true"></div>

<!-- Full-Screen Floating Living Interface -->
<main class="medhas-login-viewport">
    <section class="medhas-floating-auth">
        <!-- Brand Emblem & Title -->
        <header class="medhas-auth__brand-header">
            <div class="medhas-auth__brand">
                <div class="medhas-auth__logo-emblem" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <span class="medhas-auth__brand-name">MED<span>HAS</span></span>
            </div>
            <h1 class="medhas-auth__title">Welcome back</h1>
            <p class="medhas-auth__subtitle">Sign in to enter the living knowledge portal & resources</p>
        </header>

        <!-- Floating Transparent Login Form -->
        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="medhas-field-group">
                <label class="medhas-field-label" for="name">Full Name</label>
                <input type="text" id="name" class="medhas-input-field" placeholder="e.g. Lokesh Thanala" autocomplete="name" required>
                <span class="medhas-error-text" id="nameErr">Please enter your name</span>
            </div>

            <div class="medhas-field-group">
                <label class="medhas-field-label" for="regno">Registration / Roll Number</label>
                <input type="text" id="regno" class="medhas-input-field" placeholder="e.g. 22A91A0501" autocomplete="off" required>
                <span class="medhas-error-text" id="regErr">Please enter your registration number</span>
            </div>

            <div class="medhas-field-group">
                <label class="medhas-field-label" for="branch">Engineering Department</label>
                <select id="branch" class="medhas-input-field medhas-select-field" required>
                    <option value="">-- Choose your department --</option>
                    <option value="CSE">Computer Science & Engineering (CSE)</option>
                    <option value="AIDS">AI & Data Science (AIDS)</option>
                    <option value="AIML">AI & Machine Learning (AIML)</option>
                    <option value="ECE">Electronics & Communication (ECE)</option>
                    <option value="IT">Information Technology (IT)</option>
                    <option value="MECH">Mechanical Engineering (MECH)</option>
                    <option value="CIVIL">Civil Engineering (CIVIL)</option>
                    <option value="EEE">Electrical & Electronics (EEE)</option>
                    <option value="CSD">CS & Design (CSD)</option>
                    <option value="CSBS">CS & Business Systems (CSBS)</option>
                </select>
                <span class="medhas-error-text" id="branchErr">Please select your department</span>
            </div>

            <button type="submit" class="medhas-submit-action" id="loginBtn">
                <span>Continue to Dashboard</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <a class="medhas-admin-access" href="admin.html">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Faculty & Admin Access</span>
        </a>

        <div class="medhas-footer-meta">
            © 2026 MEDHAS • Learn. Think. Build.
        </div>
    </section>
</main>

<script src="medhas-animation.js"></script>
<script>
    // Initialize full-screen MEDHAS living knowledge interface
    let medhasEngine = null;
    (function initLivingInterface() {
        if (typeof MedhasAnimation !== 'undefined') {
            medhasEngine = MedhasAnimation.init({
                container: document.body
            });
            window._medhasEngine = medhasEngine;
        }
    })();

    // MEDHAS Form Interaction Controller
    // Coordinates form interaction events with the living knowledge interface
    (function initFormController() {
        const FIELD_ORDER = ['name', 'regno', 'branch'];
        let lastActiveField = null;
        let lastActiveRect = null;
        let tabDirection = 'forward';
        let typingThrottleTimer = null;

        // Detect tab / shift+tab direction from keyboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                tabDirection = e.shiftKey ? 'reverse' : 'forward';
            }
        }, { capture: true });

        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('name');
            const regnoInput = document.getElementById('regno');
            const branchSelect = document.getElementById('branch');
            const loginBtn = document.getElementById('loginBtn');
            const form = document.getElementById('loginForm');

            const elements = {
                name: nameInput,
                regno: regnoInput,
                branch: branchSelect
            };

            function checkFormValidity() {
                const nameVal = nameInput ? nameInput.value.trim() : '';
                const regnoVal = regnoInput ? regnoInput.value.trim() : '';
                const branchVal = branchSelect ? branchSelect.value.trim() : '';
                const isReady = !!(nameVal && regnoVal && branchVal);
                
                if (medhasEngine && typeof medhasEngine.setReady === 'function') {
                    medhasEngine.setReady(isReady);
                }
                if (loginBtn) {
                    if (isReady) {
                        loginBtn.classList.add('is-ready');
                    } else {
                        loginBtn.classList.remove('is-ready');
                    }
                }
            }

            function handleFieldFocus(fieldName) {
                const el = elements[fieldName];
                if (!el) return;

                if (!medhasEngine) return;

                if (typeof medhasEngine.setTarget === 'function') {
                    medhasEngine.setTarget(el, fieldName);
                } else if (typeof medhasEngine.activateField === 'function') {
                    medhasEngine.activateField(fieldName, el.getBoundingClientRect());
                }

                lastActiveField = fieldName;
                lastActiveRect = el.getBoundingClientRect();
            }

            function handleTyping(fieldName) {
                checkFormValidity();
                if (!medhasEngine || typeof medhasEngine.onFieldTyping !== 'function') return;

                if (typingThrottleTimer) return;
                typingThrottleTimer = setTimeout(() => {
                    typingThrottleTimer = null;
                }, 180);

                const el = elements[fieldName];
                if (el) {
                    medhasEngine.onFieldTyping(fieldName, el.getBoundingClientRect());
                }
            }

            // Bind Field Focus & Input Events
            if (nameInput) {
                nameInput.addEventListener('focus', () => handleFieldFocus('name'));
                nameInput.addEventListener('input', () => handleTyping('name'));
                nameInput.addEventListener('click', () => handleFieldFocus('name'));
            }

            if (regnoInput) {
                regnoInput.addEventListener('focus', () => handleFieldFocus('regno'));
                regnoInput.addEventListener('input', () => handleTyping('regno'));
                regnoInput.addEventListener('click', () => handleFieldFocus('regno'));
            }

            if (branchSelect) {
                branchSelect.addEventListener('focus', () => handleFieldFocus('branch'));
                branchSelect.addEventListener('click', () => handleFieldFocus('branch'));
                branchSelect.addEventListener('change', () => {
                    const rect = branchSelect.getBoundingClientRect();
                    if (medhasEngine && typeof medhasEngine.setDepartment === 'function') {
                        medhasEngine.setDepartment(branchSelect.value, rect);
                    }
                    checkFormValidity();
                });
            }

            // Clear target when clicking outside the form pane
            document.addEventListener('click', (e) => {
                const formCard = document.querySelector('.medhas-floating-auth');
                if (formCard && !formCard.contains(e.target) && medhasEngine && typeof medhasEngine.clearTarget === 'function') {
                    medhasEngine.clearTarget();
                    lastActiveField = null;
                }
            });

            // Button Hover and Focus Interactions
            if (loginBtn) {
                const triggerBtnHover = () => {
                    if (medhasEngine && typeof medhasEngine.triggerButtonHover === 'function') {
                        medhasEngine.triggerButtonHover(loginBtn.getBoundingClientRect());
                    }
                };
                loginBtn.addEventListener('mouseenter', triggerBtnHover);
                loginBtn.addEventListener('focus', triggerBtnHover);
                loginBtn.addEventListener('mouseleave', () => {
                    if (lastActiveField && elements[lastActiveField] && document.activeElement === elements[lastActiveField]) {
                        medhasEngine && medhasEngine.setTarget(elements[lastActiveField], lastActiveField);
                    }
                });
            }

            // Initial check
            checkFormValidity();
        });
    })();

    const SHEET_URL = CONFIG.SHEET_URL;

    function handleLogin() {
        const nameEl   = document.getElementById('name');
        const regnoEl  = document.getElementById('regno');
        const branchEl = document.getElementById('branch');

        const name   = nameEl.value.trim();
        const regno  = regnoEl.value.trim();
        const branch = branchEl.value;

        document.getElementById('nameErr').style.display = 'none';
        document.getElementById('regErr').style.display = 'none';
        document.getElementById('branchErr').style.display = 'none';

        let valid = true;
        let firstInvalidField = null;
        let firstInvalidEl = null;

        if (!name) {
            document.getElementById('nameErr').style.display = 'block';
            valid = false;
            if (!firstInvalidField) { firstInvalidField = 'name'; firstInvalidEl = nameEl; }
        }
        if (!regno) {
            document.getElementById('regErr').style.display = 'block';
            valid = false;
            if (!firstInvalidField) { firstInvalidField = 'regno'; firstInvalidEl = regnoEl; }
        }
        if (!branch) {
            document.getElementById('branchErr').style.display = 'block';
            valid = false;
            if (!firstInvalidField) { firstInvalidField = 'branch'; firstInvalidEl = branchEl; }
        }

        if (!valid) {
            if (window._medhasEngine && typeof window._medhasEngine.triggerError === 'function') {
                window._medhasEngine.triggerError(firstInvalidField, firstInvalidEl ? firstInvalidEl.getBoundingClientRect() : null);
            }
            if (firstInvalidEl) {
                firstInvalidEl.focus();
            }
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = `<span>Entering Medhas...</span>`;

        const timestamp = new Date().toLocaleString();

        const formData = new FormData();
        formData.append('name', name);
        formData.append('regno', regno);
        formData.append('branch', branch);
        formData.append('timestamp', timestamp);

        const completeLogin = () => {
            setAuthSession({ name, regno, branch });
            if (window._medhasEngine && typeof window._medhasEngine.triggerLoginTransition === 'function') {
                window._medhasEngine.triggerLoginTransition(() => {
                    window.location.href = 'home.html';
                });
            } else {
                window.location.href = 'home.html';
            }
        };

        fetch(SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: formData
        })
        .then(() => {
            completeLogin();
        })
        .catch(() => {
            completeLogin();
        });
    }
</script>

</body>
</html>
