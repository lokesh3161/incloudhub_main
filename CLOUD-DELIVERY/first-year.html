<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1st Year Academics — MEDHAS</title>
    <link rel="stylesheet" href="incloud-design.css">
    <script src="auth.js"></script>
    <script>requireAuth();</script>
    <style>
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--ich-text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .page-title span {
            color: var(--ich-primary);
        }

        .page-desc {
            color: var(--ich-text-secondary);
            font-size: 0.95rem;
        }

        .filter-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .subject-search-input {
            background: #FFFFFF;
            border: 1px solid var(--ich-border-medium);
            border-radius: var(--ich-radius-lg);
            padding: 12px 18px;
            color: var(--ich-text-primary);
            font-size: 0.9rem;
            width: 100%;
            max-width: 360px;
            outline: none;
            box-shadow: var(--ich-shadow-sm);
            transition: all var(--ich-transition-fast);
        }

        .subject-search-input:focus {
            border-color: var(--ich-primary);
            box-shadow: 0 0 0 3px rgba(247, 140, 37, 0.15);
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .subject-card {
            background: var(--ich-surface-1);
            border: 1px solid var(--ich-border-subtle);
            border-radius: var(--ich-radius-lg);
            box-shadow: var(--ich-shadow-sm);
            padding: 24px;
            text-decoration: none;
            color: var(--ich-text-primary);
            transition: all var(--ich-transition-base);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .subject-card:hover {
            border-color: var(--ich-border-accent);
            transform: translateY(-3px);
            box-shadow: var(--ich-shadow-md), var(--ich-shadow-glow);
            background: var(--ich-surface-1);
        }

        .subject-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .subject-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--ich-radius-md);
            background: var(--ich-surface-2);
            border: 1px solid var(--ich-border-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .subject-card:hover .subject-icon {
            background: var(--ich-primary-light);
            border-color: var(--ich-primary);
        }

        .subject-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--ich-text-primary);
            margin-bottom: 6px;
        }

        .subject-desc {
            font-size: 0.85rem;
            color: var(--ich-text-muted);
            line-height: 1.55;
            margin-bottom: 20px;
        }

        .subject-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--ich-border-subtle);
            padding-top: 14px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--ich-primary);
        }
    </style>
</head>
<body>

<div class="ich-page-wrapper">
    <div class="ich-container">

        <!-- Breadcrumbs Mount -->
        <div id="ich-breadcrumbs-mount"></div>

        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">1st Year <span>Academics Hub</span></h1>
                <p class="page-desc">Comprehensive lecture notes, previous question papers, and lab manuals for first-year engineering students.</p>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
            <div style="font-weight: 700; color: var(--ich-text-primary); font-size: 1rem; display: flex; align-items: center; gap: 8px;">
                <span>📚</span> All 1st Year Core Subjects (8)
            </div>
            <input type="text" id="subject-search" class="subject-search-input" placeholder="Search subjects (e.g. Maths, Physics, C)..." oninput="handleFilterSubjects(this.value)">
        </div>

        <!-- Subjects Grid -->
        <div class="subjects-grid" id="subjects-grid">
            <!-- Rendered dynamically -->
        </div>

    </div>
</div>

<div id="ich-footer-mount"></div>

<script src="incloud-shell.js"></script>
<script>
    renderGlobalNav('academics');
    renderGlobalFooter('ich-footer-mount');
    renderBreadcrumbs([
        { label: 'Home', url: 'home.html' },
        { label: 'Academics', url: 'first-year.html' }
    ]);

    const SUBJECTS = [
        {
            id: '1styearmaths',
            title: 'Mathematics',
            badgeClass: 'ich-badge-orange',
            icon: '📐',
            url: '1styearmaths.html',
            desc: 'Matrices, Rank, Differential Calculus, Mean Value Theorems, Multiple Integrals & First-Order Differential Equations.'
        },
        {
            id: '1styearclanguage',
            title: 'C Programming',
            badgeClass: 'ich-badge-orange',
            icon: '💻',
            url: '1styearclanguage.html',
            desc: 'Control Flow, Pointers, Pointer Arithmetic, Dynamic Memory Allocation, Arrays, Structs, File I/O & Modular Programming.'
        },
        {
            id: '1styearphysics',
            title: 'Applied Physics',
            badgeClass: 'ich-badge-orange',
            icon: '⚛️',
            url: '1styearphysics.html',
            desc: 'Wave Optics, Interference, Diffraction, Lasers, Quantum Mechanics, Energy Bands & Fiber Optic Communication.'
        },
        {
            id: '1styearchemistry',
            title: 'Engineering Chemistry',
            badgeClass: 'ich-badge-orange',
            icon: '🧪',
            url: '1styearchemistry.html',
            desc: 'Water Technology, Electrochemistry, Batteries, Corrosion Science, Polymers, Lubricants & Spectroscopic Techniques.'
        },
        {
            id: '1styearbeee',
            title: 'Basic Electrical & Electronics (BEEE)',
            badgeClass: 'ich-badge-orange',
            icon: '⚡',
            url: '1styearbeee.html',
            desc: 'Mesh & Nodal Analysis, AC Sinusoidal Circuits, DC Machines, Transformers, PN Junction Diodes & Transistors.'
        },
        {
            id: '1styearenglish',
            title: 'Communicative English',
            badgeClass: 'ich-badge-orange',
            icon: '📖',
            url: '1styearenglish.html',
            desc: 'Grammar Essentials, Technical Vocabulary Building, Formal Email Drafting, Reading Comprehension & Report Writing.'
        },
        {
            id: '1styearbcme',
            title: 'Basic Civil & Mechanical (BCME)',
            badgeClass: 'ich-badge-orange',
            icon: '🏗️',
            url: '1styearbcme.html',
            desc: 'Surveying, Construction Materials, Thermal Engineering, Power Plants, IC Engines & Manufacturing Processes.'
        },
        {
            id: '1styeardatastructures',
            title: 'Data Structures & Algorithms',
            badgeClass: 'ich-badge-blue',
            icon: '🌳',
            url: '1styeardatastructures.html',
            desc: 'Singly & Doubly Linked Lists, Stacks, Queues, Binary Search Trees, AVL Trees, Hashing, Graph Traversals & Sorting.'
        }
    ];

    let searchQuery = '';

    function handleFilterSubjects(query) {
        searchQuery = (query || '').trim().toLowerCase();
        renderSubjects();
    }

    function renderSubjects() {
        const grid = document.getElementById('subjects-grid');
        if (!grid) return;

        let filtered = SUBJECTS;
        if (searchQuery) {
            filtered = filtered.filter(s => 
                s.title.toLowerCase().includes(searchQuery) ||
                s.desc.toLowerCase().includes(searchQuery)
            );
        }

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 48px 16px; color: var(--ich-text-muted);">
                    <div style="font-size: 2.2rem; margin-bottom: 8px;">📚</div>
                    <div style="font-weight: 700; color: var(--ich-text-primary); margin-bottom: 4px;">No matching subjects found</div>
                    <div style="font-size: 0.88rem;">Try searching for "Maths", "Physics", or "C Programming".</div>
                </div>
            `;
            return;
        }

        grid.innerHTML = filtered.map(s => `
            <a href="${s.url}" class="subject-card" onclick="if(typeof recordRecentSubject === 'function') recordRecentSubject('${s.id}', '${s.title}', '${s.url}', '${s.icon}')">
                <div>
                    <div class="subject-card-top">
                        <div class="subject-icon">${s.icon}</div>
                        <span class="ich-badge ich-badge-orange">1st Year</span>
                    </div>
                    <h3 class="subject-name">${escapeHtml(s.title)}</h3>
                    <p class="subject-desc">${escapeHtml(s.desc)}</p>
                </div>
                <div class="subject-card-footer">
                    <span>Access Notes & Papers</span>
                    <span>→</span>
                </div>
            </a>
        `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
        renderSubjects();
    });
</script>

</body>
</html>
