<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Structures — 1st Year Study Notes — MEDHAS</title>
    <link rel="stylesheet" href="incloud-design.css">
    <script src="auth.js"></script>
    <script>requireAuth();</script>
    <style>
        .subject-hero {
            background: var(--ich-surface-1);
            border: 1px solid var(--ich-border-subtle);
            box-shadow: var(--ich-shadow-sm);
            border-radius: var(--ich-radius-xl);
            padding: 28px 32px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .subject-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .subject-hero-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--ich-radius-lg);
            background: var(--ich-primary-light);
            border: 1px solid var(--ich-border-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--ich-primary);
        }

        .subject-title {
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--ich-text-primary);
            margin-bottom: 4px;
        }

        .subject-sub {
            color: var(--ich-text-secondary);
            font-size: 0.88rem;
        }

        .subject-search {
            width: 100%;
            max-width: 280px;
        }
    </style>
</head>
<body>

<div class="ich-page-wrapper">
    <div class="ich-container">
        
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
            <div id="ich-breadcrumbs-mount"></div>
            <a href="first-year.html" class="ich-btn ich-btn-ghost ich-btn-sm">← Back to 1st Year Subjects</a>
        </div>

        <div class="subject-hero">
            <div class="subject-info">
                <div class="subject-hero-icon">🌳</div>
                <div>
                    <h1 class="subject-title">Data Structures</h1>
                    <p class="subject-sub">Linked Lists, Stacks, Queues, Binary Trees, Graphs, Sorting & Searching Algorithms</p>
                </div>
            </div>
            <div class="subject-search">
                <input type="text" class="ich-btn ich-btn-secondary" style="width: 100%; text-align: left; padding: 10px 16px;" placeholder="Filter topics or questions..." oninput="filterSubjectNotesLive('1styeardatastructures', this.value)">
            </div>
        </div>

        <div id="unit-tabs-mount"></div>

        <div style="margin-bottom: 14px; font-weight: 700; color: var(--ich-text-primary); font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ich-primary)" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
            Available Notes & Question Papers
        </div>

        <div id="notes-list-container">
            <!-- Dynamic notes rendered here -->
        </div>

    </div>
</div>

<div id="ich-footer-mount"></div>

<script src="incloud-shell.js"></script>
<script src="notes-client.js"></script>
<script>
    renderGlobalNav('academics');
    renderBreadcrumbs([
        { label: 'Home', url: 'home.html' },
        { label: 'Academics', url: 'select-year.html' },
        { label: '1st Year', url: 'first-year.html' },
        { label: 'Data Structures', url: '1styeardatastructures.html' }
    ]);
    renderGlobalFooter('ich-footer-mount');

    window.addEventListener('DOMContentLoaded', () => {
        loadDynamicNotes('1styeardatastructures');
    });
</script>

</body>
</html>
